[package]
name = "onenote-viewer"
version = "0.1.0"
edition = "2021"
description = "A read-only desktop viewer for Microsoft OneNote notebook files (.one, .onetoc2)"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/onenote-viewer"
keywords = ["onenote", "viewer", "gtk4", "linux"]
categories = ["gui"]

[dependencies]
# GTK4 and libadwaita
gtk4 = "0.9"
libadwaita = "0.7"

# OneNote parser
onenote_parser = "0.3"

# Async and utilities
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"

# Image handling
image = "0.25"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[package.metadata.deb]
maintainer = "Your Name <your.email@example.com>"
copyright = "2024, Your Name"
license-file = ["LICENSE", "0"]
extended-description = """A read-only desktop viewer for Microsoft OneNote notebook files.
Supports .onetoc2 (notebook root) and standalone .one files.
Features include sidebar navigation, text rendering with basic formatting,
embedded images, and attachment viewing."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/onenote-viewer", "usr/bin/", "755"],
    ["assets/onenote-viewer.desktop", "usr/share/applications/", "644"],
    ["data/com.example.onenote-viewer.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/hicolor/**/*", "usr/share/icons/hicolor/", "644"],
]

[profile.release]
lto = true
strip = true
codegen-units = 1
