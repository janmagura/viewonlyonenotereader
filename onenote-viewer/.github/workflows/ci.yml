name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev librsvg2-dev
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-action@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Check formatting
      run: cargo fmt --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Build
      run: cargo build --release
    
    - name: Run tests
      run: cargo test --release
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: onenote-viewer-linux
        path: target/release/onenote-viewer
        retention-days: 7

  package-deb:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev librsvg2-dev
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-action@stable
    
    - name: Install cargo-deb
      run: cargo install cargo-deb
    
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-deb-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-deb-
    
    - name: Build .deb package
      run: cargo deb
    
    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: onenote-viewer.deb
        path: target/debian/*.deb
        retention-days: 7

  check-all:
    runs-on: ubuntu-latest
    needs: [build, package-deb]
    
    steps:
    - name: All checks passed
      run: echo "All CI checks completed successfully!"
